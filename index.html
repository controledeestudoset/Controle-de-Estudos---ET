<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Controle de Estudos - ET</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ok:#10b981;--err:#ef4444;--info:#38bdf8;
  --bg-main:#0b1120;--bg-card:#1e293b;--bg-card-hover:#27354a;--bg-input:#0f172a;--bg-side:#0a0f1d;--bg-head:#16213a;--text-soft:#cbd5e1;--on-primary:#0b1120;
  --primary:#10b981;--primary-dark:#059669;--accent:#38bdf8;--warning:#f59e0b;--danger:#ef4444;
  --text-main:#f8fafc;--text-muted:#94a3b8;--border:#334155;
  --tag-teoria:#6366f1;--tag-questoes:#ec4899;--tag-lei:#eab308;--tag-bizu:#14b8a6;--tag-rev:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
html{scroll-behavior:auto}
body{background:var(--bg-main);color:var(--text-main);line-height:1.5;font-size:15px}
button{font-family:inherit}
.app{display:flex;min-height:100vh}

/* ===== Sidebar ===== */
#sidebar{width:262px;flex:0 0 262px;background:var(--bg-side);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px;z-index:50}
.brand{padding:4px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand h1{font-size:1.02rem;font-weight:700;line-height:1.25}
.brand p{font-size:.74rem;color:var(--text-muted);margin-top:3px}
.brand .badge-concurso{display:inline-block;margin-top:8px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);border:1px solid var(--primary);padding:2px 10px;border-radius:9999px;font-weight:700;font-size:.72rem}
.nav-section{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;color:var(--text-soft);padding:9px 10px;border-radius:9px;font-size:.86rem;font-weight:500;cursor:pointer;text-align:left;transition:background .15s}
.nav-item:hover{background:color-mix(in srgb,var(--text-main) 8%,transparent)}
.nav-item.active{background:var(--bg-card);border-color:var(--accent);color:var(--text-main);font-weight:600}
.nav-item .ico{width:22px;text-align:center;flex:none}
.nav-item .lbl{flex:1}
.nav-badge{background:var(--danger);color:#fff;border-radius:9999px;font-size:.68rem;font-weight:700;padding:1px 7px}
.nav-badge.warn{background:var(--warning);color:var(--on-primary)}
.nav-sub{margin:2px 0 4px 22px;border-left:1px solid var(--border);padding-left:8px;display:flex;flex-direction:column;gap:2px}
.nav-sub .nav-item{font-size:.8rem;padding:7px 9px}
.side-cfg{margin-top:auto;padding-bottom:10px}.nav-sub2{margin-left:14px}
.side-foot{margin-top:0;padding-top:14px;border-top:1px solid var(--border)}
.fase-toggle{display:flex;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-top:6px}
.fase-toggle button{flex:1;background:none;border:none;color:var(--text-muted);padding:7px 4px;font-size:.78rem;font-weight:600;cursor:pointer}
.fase-toggle button.on{background:var(--primary);color:var(--on-primary)}
.side-note{font-size:.7rem;color:var(--text-muted);margin-top:6px;line-height:1.35}

main{flex:1;min-width:0;padding:24px 22px 60px}
.container{max-width:1180px;margin:0 auto}
.topbar{display:none;align-items:center;gap:10px;margin-bottom:14px}
.hamb{background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);border-radius:8px;padding:8px 12px;font-size:1rem;cursor:pointer}
.backdrop{display:none}
@media(max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #000}
  body.menu-open #sidebar{transform:none}
  body.menu-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
  .topbar{display:flex}
  main{padding:16px 12px 60px}
}

/* ===== Cabeçalhos de página ===== */
.page-head{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.page-head h2{font-size:1.4rem;font-weight:700}
.page-head p{color:var(--text-muted);font-size:.86rem;margin-top:3px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn-primary{background:var(--primary);color:var(--on-primary);border:none;padding:8px 16px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.btn-primary:hover{background:var(--primary-dark);color:var(--on-hover,#fff)}
.btn-sec{background:var(--bg-input);color:var(--text-main);border:1px solid var(--border);padding:7px 13px;border-radius:8px;font-size:.82rem;font-weight:500;cursor:pointer}
.btn-sec:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid var(--danger);padding:7px 13px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-x{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.95rem;padding:2px 7px;border-radius:5px}
.btn-x:hover{color:var(--danger);background:rgba(239,68,68,.12)}
.btn-mini{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid #a855f7;border-radius:6px;padding:2px 8px;font-size:.74rem;cursor:pointer}
.btn-mini:hover{background:#a855f7;color:#fff}

/* ===== Abas ===== */
.view-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);padding:9px 16px;border-radius:10px;font-size:.86rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab-btn:hover{border-color:var(--accent)}
.tab-btn.active{background:var(--border);color:var(--text-main);border-color:var(--accent)}
.tab-badge{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:9999px;font-size:.75rem}

/* ===== Cards / KPIs ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:.98rem;font-weight:700;margin-bottom:10px}
.card .hint{font-size:.8rem;color:var(--text-muted);margin-bottom:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.kpi-value{font-size:1.4rem;font-weight:700;margin-top:3px}
.kpi-sub{font-size:.74rem;color:var(--text-muted);margin-top:2px}
.kpi-card.good .kpi-value{color:var(--ok)}
.kpi-card.bad .kpi-value{color:var(--danger)}
.kpi-card.warn .kpi-value{color:var(--warning)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.empty{text-align:center;padding:34px;background:var(--bg-card);border-radius:12px;border:1px dashed var(--border);color:var(--text-muted)}
.empty p{margin-bottom:12px}

/* ===== Semanas ===== */
.weeks-container{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.weeks-label{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:10px;display:flex;justify-content:space-between}
.weeks-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.weeks-scroll::-webkit-scrollbar{height:6px}.weeks-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.btn-week{background:var(--bg-input);border:1px solid var(--border);color:var(--text-muted);padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;min-width:82px}
.btn-week .sub{font-size:.68rem;font-weight:400;margin-top:2px}
.btn-week:hover,.btn-week.active{background:var(--accent);color:var(--on-primary);border-color:var(--accent)}
.progress-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.progress-header{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;margin-bottom:8px}
.progress-bar-bg{background:var(--border);height:10px;border-radius:9999px;overflow:hidden}
.progress-bar-fill{background:linear-gradient(90deg,var(--ok),var(--info));height:100%;transition:width .3s}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:8px;font-size:.78rem;cursor:pointer;font-weight:500}
.filter-btn:hover,.filter-btn.active{background:var(--primary);color:var(--on-primary);font-weight:600;border-color:var(--primary)}

/* ===== Cards de tarefa ===== */
.metas-list{display:flex;flex-direction:column;gap:14px}
.meta-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.meta-card.completed{border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:color-mix(in srgb,var(--bg-card) 60%,transparent)}
.meta-card.completed .meta-title{text-decoration:line-through;color:var(--text-muted)}
.meta-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.tag-materia{background:var(--border);color:var(--text-main)}
.tag-teoria{background:rgba(99,102,241,.2);color:var(--tag-teoria);border:1px solid var(--tag-teoria)}
.tag-questoes{background:rgba(236,72,153,.2);color:var(--tag-questoes);border:1px solid var(--tag-questoes)}
.tag-lei{background:rgba(234,179,8,.2);color:var(--tag-lei);border:1px solid var(--tag-lei)}
.tag-bizu{background:rgba(20,184,166,.2);color:var(--tag-bizu);border:1px solid var(--tag-bizu)}
.tag-rev{background:rgba(168,85,247,.2);color:var(--tag-rev);border:1px solid var(--tag-rev)}
.meta-top-actions{display:flex;align-items:center;gap:10px}
.meta-time{font-size:.8rem;color:var(--text-muted);white-space:nowrap}
.btn-icon-edit{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.85rem;padding:2px 6px;border-radius:4px}
.btn-icon-edit:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.meta-content{display:flex;gap:14px;align-items:flex-start}
.meta-checkbox{width:22px;height:22px;accent-color:var(--primary);cursor:pointer;margin-top:3px;flex:none}
.meta-details{flex:1;min-width:0}
.meta-title{font-size:1rem;font-weight:600;margin-bottom:4px}
.meta-description{font-size:.86rem;color:var(--text-muted);line-height:1.45}
.meta-instructions{background:color-mix(in srgb,var(--bg-input) 70%,transparent);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px;font-size:.82rem;color:var(--text-soft)}
.revisoes-resumo{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.badge-revisao-tag{font-size:.72rem;padding:2px 8px;border-radius:4px;background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.4)}
.badge-revisao-tag.done{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,transparent);text-decoration:line-through}
.meta-footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--border) 40%,transparent)}
.metrics-inputs{display:flex;gap:12px;align-items:center;font-size:.8rem}
.metrics-inputs label{color:var(--text-muted);display:flex;align-items:center;gap:6px}
.metrics-inputs input{width:60px;text-align:center}
.meta-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-action{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border:1px solid var(--accent);padding:4px 10px;border-radius:6px;font-size:.78rem;text-decoration:none;font-weight:500;cursor:pointer}
.btn-action:hover{background:var(--accent);color:var(--on-primary)}
.btn-caderno{background:rgba(236,72,153,.15);color:#f472b6;border-color:#ec4899}.btn-caderno:hover{background:#ec4899;color:#fff}
.btn-rev{background:rgba(168,85,247,.15);color:#c084fc;border-color:#a855f7}.btn-rev:hover{background:#a855f7;color:#fff}
.btn-aula{background:rgba(99,102,241,.15);color:#a5b4fc;border-color:#6366f1}.btn-aula:hover{background:#6366f1;color:#fff}

/* ===== Revisões ===== */
.revisao-row{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.revisao-row.late{border-left:4px solid var(--danger)}.revisao-row.today{border-left:4px solid var(--warning)}
.revisao-row.future{border-left:4px solid var(--primary)}.revisao-row.done{border-left:4px solid var(--border);opacity:.6}
.revisao-main-info{flex:1;min-width:200px}.revisao-title{font-weight:600;font-size:.95rem}.revisao-meta-ref{font-size:.8rem;color:var(--text-muted);margin-top:2px}
.revisao-date-badge{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:6px}
.date-late{background:rgba(239,68,68,.2);color:#f87171}.date-today{background:rgba(245,158,11,.2);color:#fbbf24}
.date-future{background:color-mix(in srgb,var(--primary) 20%,transparent);color:#34d399}.date-done{background:var(--border);color:var(--text-muted)}
.row-actions{display:flex;align-items:center;gap:10px}

/* ===== Inputs / formulários ===== */
.cell,.form-group input,.form-group select,.form-group textarea,select.cell,textarea.cell,.inline-form input,.inline-form select{background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);padding:6px 8px;border-radius:6px;font-size:.85rem;width:100%;min-width:0}
.cell:focus,.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
.cell.num{text-align:center;max-width:90px}
textarea.cell{resize:vertical;min-height:70px}
.form-group{margin-bottom:12px}
.form-group label,.lbl-sm{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:4px;font-weight:500}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.form-row,.form-row3{grid-template-columns:1fr}}
.inline-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.chk{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--text-soft);margin:6px 0}
.chk input{accent-color:var(--primary);width:16px;height:16px}

/* ===== Tabelas ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--bg-card)}
.tbl th{background:var(--bg-head);color:var(--text-muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:9px 8px;text-align:left;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:5px 6px;border-top:1px solid color-mix(in srgb,var(--border) 55%,transparent);vertical-align:middle}
.tbl td.calc{background:color-mix(in srgb,var(--primary) 7%,transparent);text-align:center;font-weight:600;white-space:nowrap}
.tbl td.calc.l{text-align:left}
.tbl tr.cp td{background:rgba(234,179,8,.12);color:var(--tag-lei);font-weight:700;text-align:center;letter-spacing:.08em;font-size:.78rem}
.tbl tfoot td{background:var(--bg-head);font-weight:700;border-top:2px solid var(--border)}
.tbl .w-aula{width:56px;text-align:center;font-weight:700;color:var(--accent)}
.tbl .pct{width:90px}
.tbl .pct input{text-align:center;font-weight:600;color:var(--text-main)}
.legend-calc{font-size:.76rem;color:var(--text-muted);margin:8px 0}
.legend-calc i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.mini-bar{height:7px;background:var(--border);border-radius:9999px;overflow:hidden;min-width:70px}
.mini-bar>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--info))}
.pill{display:inline-block;padding:1px 9px;border-radius:9999px;font-size:.72rem;font-weight:700}
.pill.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#34d399}.pill.y{background:rgba(245,158,11,.18);color:#fbbf24}
.pill.r{background:rgba(239,68,68,.18);color:#f87171}.pill.b{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}.pill.n{background:var(--border);color:var(--text-muted)}

/* ===== Chips (disciplinas) ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{background:var(--bg-input);border:1px solid var(--border);color:var(--text-muted);padding:6px 12px;border-radius:9999px;font-size:.8rem;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--on-primary);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--primary)}

/* ===== Seleção de matérias ===== */
.edital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:12px}
.edital-col{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px}
.edital-col .nm{font-weight:700;margin-bottom:8px}
.edital-col .it{display:flex;gap:4px;margin-bottom:4px}
.cnt{display:inline-block;min-width:24px;text-align:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-radius:6px;font-size:.76rem;font-weight:700;padding:1px 6px}
.uniq-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid color-mix(in srgb,var(--border) 40%,transparent);font-size:.84rem}
.uniq-row .n{flex:1}

/* ===== Gráficos ===== */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-muted);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.76rem;color:var(--text-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* ===== Modais ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal-content{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.modal-header h2{font-size:1.15rem;font-weight:700}
.btn-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer}
.modal-footer{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.quick-intervals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.btn-interval{background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);padding:8px 4px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn-interval:hover{background:var(--tag-rev);color:#fff}
.existing-revs-list{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.existing-rev-item{display:flex;justify-content:space-between;align-items:center;background:var(--bg-input);padding:8px 12px;border-radius:6px;font-size:.85rem}

/* ===== Importar ===== */
.imp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1000px){.imp-grid{grid-template-columns:1fr}}
.imp-card{background:var(--bg-card);border:2px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.imp-card.sel{border-color:var(--accent)}
.imp-card h3{font-size:1rem}.imp-card ul{font-size:.8rem;color:var(--text-muted);padding-left:18px}

/* status das matérias (Ciclo e Edital pós) acompanha os registros: Pendente → Iniciada → Finalizada */
function syncStatus() {
  const sync = (rows, ini, st) => rows.forEach(r => {
    if (!r.materia) return;
    /* matéria finalizada na Revisão Checkpoint (d.fim) => Finalizada no Ciclo/Edital */
    const dd = S[st].disc.find(x => normA(x.nome) === normA(r.materia));
    if (dd && dd.fim) { r.status = 'Finalizada'; return; }
    if (!S.diario.some(e => e.materia === r.materia && (!ini || e.data >= ini))) return;
    const pa = progAs(r.materia);
    if (!r.status || r.status === 'Pendente' || (r.status === 'Finalizada' && pa.n)) r.status = 'Iniciada';
  });
  sync(S.controle.ciclo.rows, S.controle.ciclo.inicio, 'pre'); sync(S.pos.edital.rows, S.pos.edital.inicio, 'pos');
}

  const fx = [], n0 = parseAulaNum(e.aula), nome = x => x === 'pre' ? 'Pré-edital' : 'Pós-edital';
  const st0 = storeDe(e), targets = [st0].map(st => ({ st, dd: S[st].disc.find(x => x.nome.toLowerCase() === e.materia.toLowerCase()) })).filter(x => x.dd);
  if (!targets.length) { const dd = newDisc(e.materia); S[st0].disc.push(dd); targets.push({ st: st0, dd }); fx.push('matéria criada em Revisão Checkpoint' + (st0 === 'pos' ? ' (Pós-edital)' : '')); }
  targets.forEach(({ st, dd }) => {
    let a = null;
    if (n0 != null) { a = dd.aulas.find(x => x.t === 'a' && +x.n === n0); if (!a) { a = { t: 'a', u: 1, n: n0, nome: '', sit: 'Estudar', p1: '', pc: '', prg: '' }; dd.aulas.push(a); } }
    else if (e.assunto) {
      a = dd.aulas.find(x => x.t === 'a' && normA(x.nome) === normA(e.assunto));
      if (!a && e.fim) {
        const ns = dd.aulas.filter(x => x.t === 'a').map(x => num(x.n)); a = { t: 'a', u: 1, n: ns.length ? Math.max(...ns) + 1 : 1, nome: '', sit: 'Estudar', p1: '', pc: '', prg: '' }; dd.aulas.push(a);
      }
    }
    if (!a) return;
    if (!a.nome && e.assunto) a.nome = e.assunto;
    const ant = a.sit;
    if (SIT_AULA.includes(d.sit)) a.sit = d.sit;
    else if (d.sit === 'auto') { if (e.fim && (!a.sit || a.sit === 'Estudar')) a.sit = 'Revisar Checkpoint'; }
    if (a.sit !== 'Estudar' && ant === 'Estudar') a.fd = e.data || todayISO();
    if (q > 0) a[d.pctCampo] = Math.round(num(d.ac) / q * 1000) / 10;
    fx.push(`${nome(st)} · ${dd.nome} · aula ${a.n}${a.sit !== ant ? ' → ' + a.sit : ''}${q > 0 ? ` (${a[d.pctCampo]}%)` : ''}`);
  });
  return fx;
}

/* ----- Finalizado no Diário/Registrar → aula "Revisar Checkpoint" nas planilhas (alimenta o Checkpoint) ----- */
function aulaDoRegistro(e, criar) {
  const n0 = parseAulaNum(e.aula), nm = String(e.assunto || '').trim(), out = [];
  if (!e.materia || (n0 == null && !nm)) return out;
  const st0 = storeDe(e); let dds = [S[st0].disc.find(x => x.nome.toLowerCase() === e.materia.toLowerCase())].filter(Boolean);
  if (!dds.length && criar) { const dd = newDisc(e.materia); S[st0].disc.push(dd); dds = [dd]; }
  dds.forEach(dd => {
    let a = n0 != null ? dd.aulas.find(x => x.t === 'a' && +x.n === n0) : null;
    if (!a && nm) a = dd.aulas.find(x => x.t === 'a' && normA(x.nome) === normA(nm));
    if (!a && criar) { const ns = dd.aulas.filter(x => x.t === 'a').map(x => num(x.n)); a = { t: 'a', u: 1, n: n0 != null ? n0 : (ns.length ? Math.max(...ns) + 1 : 1), nome: '', sit: 'Estudar', p1: '', pc: '', prg: '' }; dd.aulas.push(a); }
    if (a) out.push(a);
  });
  return out;
}
function fimAula(e) {
  let ch = false;
  if (!e.fim) return ch;
  aulaDoRegistro(e, true).forEach(a => {
    if (!a.nome && e.assunto) { a.nome = e.assunto; ch = true; }
    if (!a.sit || a.sit === 'Estudar') { a.sit = 'Revisar Checkpoint'; a.fd = e.data || todayISO(); ch = true; }
  });
  return ch;
}
function desfazFim(e) {
  const outro = S.diario.some(x => x !== e && x.fim && x.materia === e.materia && ((parseAulaNum(x.aula) != null && parseAulaNum(x.aula) === parseAulaNum(e.aula)) || (normA(x.assunto) && normA(x.assunto) === normA(e.assunto))));
  if (outro) return;
  aulaDoRegistro(e, false).forEach(a => { if (a.sit === 'Revisar Checkpoint') { a.sit = 'Estudar'; delete a.fd; } });
}
function reconcileFim() { let ch = false; S.diario.forEach(e => { if (fimAula(e)) ch = true; }); if (cpSyncFd()) ch = true; syncStatus(); return ch; }
const FIM_OK = e => !semAula(e.forma) && parseAulaNum(e.aula) != null && String(e.assunto || '').trim() !== '';
function diaFim(i, el) {

  el.checked = false;
  if (!FIM_OK(e)) { toast(semAula(e.forma) ? 'Registros do tipo ' + e.forma + ' não finalizam aula nem entram nas revisões. Use PDF ou Videoaula.' : 'Para finalizar, preencha o Nº da aula e o Aula/Assunto deste registro.'); return; }
  confirmar(`Você terminou por completo a aula/assunto <b>${esc(e.assunto)}</b> (aula ${esc(String(parseAulaNum(e.aula)))}) de <b>${esc(e.materia)}</b>?<br><br>Ela ficará com a situação <b>“Revisar Checkpoint”</b> e passará a contar para a sua <b>Revisão Checkpoint</b> (a cada ${CPN} aulas finalizadas).`, () => { e.fim = true; reconcileFim(); save(); render(); toast('✔ Aula/assunto finalizado e integrado à Revisão Checkpoint.'); }, 'Sim, terminei a aula', 'Finalizar aula/assunto?');
}

    : () => { const k = cicloCalc(); return S.controle.ciclo.rows.map((r, i) => r.materia ? { m: r.materia, fase: r.fase || 'Novo', dif: r.dif, ext: r.ext, def: k.rows[i].def, st: r.status } : null); };
  const seen = new Set(); return fn().filter(x => x && !seen.has(x.m.toLowerCase()) && seen.add(x.m.toLowerCase()));
}
const plGrupo = m => num((S.plan.grupos || {})[m]);

function plAgg(a, b, m) { const o = { min: 0, q: 0, ac: 0 }; DIA().forEach(e => { if (!e.data || e.data < a || e.data > b || (m && e.materia !== m)) return; o.min += num(e.min); if (!e.taskId) { o.q += num(e.q); o.ac += num(e.a); } }); return o; }
const plSemana = () => { const t = todayISO(), ini = semIni(t); return { t, ini, fim: addDaysISO(ini, 6), dias: [0, 1, 2, 3, 4, 5, 6].map(i => addDaysISO(ini, i)), hojeI: dowIdx(t) }; };
const plMin = m => fmtHM(Math.round(m)) || '0:00';

function plItensDia(i, iso) {

/* Semana parcial: se o ciclo começou no meio da semana, a meta dessa semana é proporcional aos dias que restaram */
function plDesde() {

/* ================= CICLO DE MATÉRIAS ================= */
function plNorm() {

  if (pl.modo === 'flexivel') { pl.modo = 'ciclo'; ch = true; }
  if (pl.modo === 'rigido' && !pl.dias.some(d => d.length) && !pl.ciclo_ok) { pl.modo = 'ciclo'; ch = true; }
  if (!pl.ciclo_ok) { pl.ciclo_ok = 1; ch = true; }
  if (S.fase === 'pos' && !S.posIni && S.diario.length) { const i = S.pos.edital.inicio; S.posIni = /^\d{4}-\d{2}-\d{2}$/.test(i || '') && i <= todayISO() ? i : todayISO(); ch = true; UI.posIniAviso = 1; }
  if (S.fase === 'pos' && S.posIni && !S.posIniTs && S.posIni === todayISO() && S.diario.some(e => e.data === S.posIni)) { S.posIniTs = Date.now(); ch = true; UI.posIniAviso = 2; }
  if (!Array.isArray(pl.ordem)) { pl.ordem = []; ch = true; }
  syncStatus();
  return ch;
}
function plOrdem() {
  const nomes = planMaterias().map(x => x.m), o = (S.plan.ordem || []).filter(m => nomes.includes(m));
  nomes.forEach(m => { if (!o.includes(m)) o.push(m); });

}
/* estado do ciclo: deduzido do Registrar estudo (nada fica "marcado à mão") */
function plCicloEst() {
  const ordem = plOrdem(), ini = S.plan.cicloIni || '0000-00-00', n = ordem.length;
  const regs = DIA().map((e, i) => ({ e, i })).filter(x => x.e.data && x.e.data >= ini && num(x.e.min) > 0 && ordem.includes(x.e.materia)).sort((a, b) => a.e.data < b.e.data ? -1 : a.e.data > b.e.data ? 1 : a.i - b.i);
  let volta = 1, done = new Set(), last = null, voltasFeitas = 0;

  const li = last ? ordem.indexOf(last) : -1, fila = [];
  for (let k = 1; k <= n; k++) { const m = ordem[(li + k) % n]; if (!done.has(m)) fila.push(m); }
  const hoje = todayISO(), hojeSet = new Set(DIA().filter(e => e.data === hoje && num(e.min) > 0).map(e => e.materia));
  return { ordem, volta, done, last, fila, prox: fila[0] || ordem[0], voltasFeitas, hojeSet, n };
}
function plCicloMover(m, d) { const o = plOrdem(), i = o.indexOf(m), j = i + d; if (i < 0 || j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; save(); render(); }
function plCicloComecar(m) {
  confirmar(`Começar uma nova volta por <b>${esc(m)}</b>? A ordem se mantém (só gira a lista); os registros anteriores deixam de contar para a volta atual.`, () => {
    const o = plOrdem(), i = o.indexOf(m); S.plan.ordem = o.slice(i).concat(o.slice(0, i)); S.plan.cicloIni = todayISO(); save(); render(); toast('Nova volta iniciada.');
  }, 'Começar', 'Nova volta');
}
function plCicloReiniciar() { confirmar('Reiniciar a volta atual? Os registros até hoje deixam de contar; a fila volta para o início da ordem.', () => { S.plan.cicloIni = todayISO(); save(); render(); }, 'Reiniciar', 'Reiniciar volta'); }
function plCicloExplica() {
  return `<details class="how" ${UI.cicloHow === false ? '' : 'open'} ontoggle="UI.cicloHow=this.open"><summary>🔁 Como funciona o Ciclo de Matérias? (clique para abrir/fechar)</summary><div class="how-b">
  <p>Aqui <b>não existem dias nem horários certos para cada matéria</b>. Existe uma <b>fila</b>: você define a ordem uma vez e vai rodando, volta após volta.</p>
  <p><b>Exemplo:</b> ordem <i>TI → Administração → Contabilidade → Português → Matemática → Penal</i>.</p>
  <ul><li><b>Segunda:</b> estudou TI, Administração e Contabilidade. A próxima da fila é <b>Português</b>.</li>
  <li><b>Terça:</b> teve um imprevisto e só deu para Português. Não tem problema: ninguém “perdeu” a vez. A próxima é <b>Matemática</b>.</li>
  <li><b>Quarta:</b> deu para 3 matérias: <b>Matemática, Penal e TI</b>. A fila continua de onde parou — a volta anterior fechou em Penal e uma nova começou.</li></ul>
  <p><b>Regras:</b></p><ul>
  <li>O Planejamento sempre mostra <b>qual é a próxima matéria</b>: a que vem depois da última que você estudou.</li>
  <li>O ciclo é deduzido do <b>Registrar estudo</b>: ao registrar uma sessão, a matéria é marcada na volta atual. Não precisa marcar nada à mão.</li>
  <li>Uma <b>volta</b> só termina quando todas as matérias da fila foram estudadas. Só então começa a próxima volta.</li>
  <li>Estudou fora da ordem? Tudo bem: a matéria conta na volta e a fila segue a partir dela, pulando as que já foram feitas.</li>
  <li>Quantas matérias por dia? As que couberem. Mantenha sessões de 30 min a 2 h e a <b>microrrevisão</b> (10%) no início de cada sessão.</li>
  <li>As horas por semana definidas no <b>Ciclo de Estudos</b> continuam como referência em <b>Semana</b>; o Ciclo de Matérias decide só a <b>ordem</b>.</li></ul>
  <p><b>Vantagem:</b> flexível com imprevistos, sem cronograma “bagunçado”. <b>Cuidado:</b> exige disciplina — evite pular sempre as matérias que menos gosta.</p></div></details>`;
}
function plBotoesExplica() {
  return `<details class="how"><summary>❓ Entenda os botões: “Começar por aqui” e “Reiniciar a volta”</summary><div class="how-b">
  <p><b>Nada do que você registrou é apagado.</b> Diário, Desempenho e relatórios continuam intactos. Os botões só mudam <b>a partir de quando</b> o ciclo passa a contar os seus registros.</p>
  <ul><li><b>↺ Reiniciar a volta atual:</b> o ciclo ignora tudo o que foi registrado até hoje. Nenhuma matéria aparece como feita nesta volta e a fila volta ao início da ordem. Use depois de uns dias parado ou quando a fila ficou bagunçada.</li>
  <li><b>Começar por aqui</b> (em cada matéria): também inicia uma nova volta, mas você escolhe qual matéria abre. A ordem relativa se mantém, só a lista “gira”. Ex.: ordem <i>A, B, C, D</i> com “Começar por C” vira <i>C, D, A, B</i>.</li>
  <li><b>↑ ↓:</b> só trocam a posição da matéria na fila. A volta atual não é afetada.</li></ul>
  <p><b>Quando usar:</b> no dia a dia você <u>não precisa</u> de nenhum botão — basta registrar os estudos que a fila anda sozinha. Eles servem para recomeços.</p></div></details>`;
}

  ${L('Imprevistos', 'Sem problema: a fila só espera', 'Bagunça o cronograma: use blocos de “Folga”', 'Afeta só a parte fixa (Estudo Novo)')}

/* ================= PLANEJAMENTO DO PÓS-EDITAL (só sugestões: quem monta é você) ================= */
function plDiasProva() { const d = S.pos.edital.prova; return d ? Math.round((new Date(d + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5) : null; }
function plRetaFinal() {
  if (S.fase !== 'pos') return ''; const d = plDiasProva(); if (d == null || d < 0 || d > 31) return '';
  const fin = d <= 14;
  return `<div class="micro-av" style="border-color:${fin ? '#ef4444' : '#f59e0b'}"><span class="micro-ic">${fin ? '🚨' : '⏳'}</span><div><b>${fin ? 'Últimas duas semanas' : 'Último mês'} para a prova (${d} dia${d === 1 ? '' : 's'}).</b> Sugestão: pause os cadernos de questões novos e foque nos ciclos de <b>erros e favoritas</b>; comece (ou intensifique) as <b>revisões teóricas</b> guiadas pela incidência dos tópicos${fin ? ' e reserve as decorebas mais importantes para a última semana' : ''}. Você decide como encaixar isso no seu planejamento.</div></div>`;
}

  ${dias == null ? '<div class="empty" style="padding:14px">Informe a data da prova para ver o tempo disponível.</div>' : dias <= 0 ? '<div class="empty" style="padding:14px">A data da prova já passou ou é hoje.</div>' : `<div class="kpi-grid" style="margin-top:12px">${kpi('Até a prova', dias + ' dias', fmt(sem, 1) + ' semanas')}${kpi('Realista · total', F(tot(re)), 'semanas × carga realista')}${kpi('Realista · antes das 2 últimas semanas', F(tot(re) == null ? null : Math.max(0, sem - fin) * re), 'tempo de estudo e questões')}${kpi('Realista · 2 últimas semanas', F(tot(re) == null ? null : fin * re), 'revisão teórica')}</div>
  <div class="kpi-grid" style="margin-top:10px">${kpi('Otimista · total', F(tot(ot)), 'semanas × carga otimista')}${kpi('Otimista · antes das 2 últimas', F(tot(ot) == null ? null : Math.max(0, sem - fin) * ot), '')}${kpi('Otimista · 2 últimas semanas', F(tot(ot) == null ? null : fin * ot), '')}</div>
  <div class="head-actions" style="margin-top:10px"><button class="btn-sec" onclick="S.pos.est.disp.semanas=${semC};save();render();toast('Semanas atualizadas na Estimativa de Tempo.')">Usar ${semC} semanas na Estimativa de Tempo</button></div>`}${plRetaFinal()}</div>`;

  const ed = E.rows.filter(r => r.materia).map(r => r.materia), ci = S.controle.ciclo.rows.filter(r => r.materia).map(r => r.materia), inN = (a, m) => a.some(x => normA(x) === normA(m));
  const fora = ci.filter(m => !inN(ed, m)), nov = ed.filter(m => !inN(ci, m)), cont = ed.filter(m => inN(ci, m));
  const prog = m => { const d = S.pre.disc.find(x => normA(x.nome) === normA(m)); if (!d) return ''; const r = discResumo(d); return r.total ? `${r.ok}/${r.total} aulas com Teoria ok` : ''; };
  const li = (a, f) => a.length ? a.map(m => `<span class="chip" style="cursor:default">${esc(m)}${f && f(m) ? ' · ' + f(m) : ''}</span>`).join(' ') : '<small>Nenhuma.</small>';

  ${!ed.length ? '<div class="empty" style="padding:14px">Preencha as matérias do Edital para comparar.</div>' : `<div class="pl-note"><b>🟡 Estão no Ciclo e não constam no edital (${fora.length})</b> — o material sugere deixá-las de lado temporariamente:<div class="pl-chips" style="margin-top:6px">${li(fora)}</div></div>

  const pg = q ? a / q * 100 : null, baixas = ed.concat(cont.length ? [] : []).filter((m, i, arr) => arr.indexOf(m) === i).filter(m => pm[m] && pm[m].q >= 20 && pm[m].a / pm[m].q * 100 < 70);
  let tA = 0, fA = 0; S.pre.disc.forEach(d => { const r = discResumo(d); tA += r.total; fA += r.fin; });

  ${ck(tA ? fA / tA >= .7 : null, tA ? `Aulas/assuntos finalizados no Pré-edital: <b>${fA} de ${tA}</b> (${fmt(fA / tA * 100, 0)}%). Referência do material: ter estudado ao menos ~70% do edital.` : 'Sem aulas cadastradas no Pré-edital para medir o que já foi estudado.')}</div>`;
  const regras = `<div class="card"><h3>🧭 4 · Reta final <small class="ds-sub">· avisos automáticos</small></h3><p class="hint-p">Com a data da prova preenchida, aparece um aviso em <b>Hoje</b> e no <b>Início</b> quando faltar <b>1 mês</b> e quando faltarem <b>2 semanas</b>: pausar cadernos novos, focar em erros/favoritas e iniciar as revisões teóricas. O prazo exato (2 semanas ou 1 mês) depende da sua velocidade — você é quem decide.</p>${dias != null && dias > 31 ? `<div class="pl-note">Faltam ${dias} dias. O primeiro aviso aparece em ${fmtDate(addDaysISO(E.prova, -31))}.</div>` : ''}</div>`;

/* ================= HOJE ================= */
function plHoje() {
  const W = plSemana(), P = planMaterias();
  if (!P.length) return `<div class="card"><div class="empty" style="padding:24px">Seu <b>Ciclo de Estudos</b> ainda não tem matérias${S.fase === 'pos' ? ' (fase Pós-edital: cadastre-as no Edital)' : ''}.<br>O Planejamento trabalha só com as matérias que você inserir lá.<br><br><button class="btn-primary" onclick="${S.fase === 'pos' ? "UI.tab.pos='edital';nav('pos')" : "goCtl('ciclo')"}">${S.fase === 'pos' ? 'Ir ao Edital' : 'Ir ao Ciclo de Estudos'}</button></div></div>`;
  const modo = S.plan.modo, blocks = S.plan.dias[W.hojeI] || [], fixo = modo !== 'ciclo' && blocks.some(b => b.m);
  const real = plAgg(W.t, W.t).min, itens = fixo ? plItensDia(W.hojeI, W.t) : [], plan = itens.filter(o => o.key !== '__folga' && o.key !== '__livre').reduce((s, o) => s + o.plan, 0);
  const falt = plFalta().filter(x => x.falta > 0).sort((a, b) => b.falta - a.falta);
  const feitos = itens.filter(o => o.plan && o.real >= o.plan * .8).length;
  const card = o => {
    const esp = plEsp(o.key), nome = plNome(o.key), pm = esp ? null : P.find(x => x.m === o.key), ok = o.plan && o.real >= o.plan * .8;
    const revs = esp ? [] : plRevs(o.key), prox = esp ? '' : plProxAula(o.key), micro = esp ? '' : plMicro(o.key);
    const solChips = o.key === '__solido' ? `<div class="pl-chips">${P.filter(x => x.fase === 'Sólido').map(x => `<button class="chip" data-m="${esc(x.m)}" onclick="event.stopPropagation();estudarMat(this.dataset.m)">${esc(x.m)}</button>`).join('') || '<small>Nenhuma matéria em Estudo Sólido no Ciclo.</small>'}</div>` : '';
    const click = !esp ? `data-m="${esc(o.key)}" onclick="estudarMat(this.dataset.m)" title="Abrir no Registrar estudo"` : '';
    return `<div class="pl-card ${ok ? 'ok' : ''} ${esp ? 'esp' : 'click'}" ${click}>
      <div class="pl-top"><b>${esc(nome)}</b>${pm ? `<span class="pill ${plFaseCls(pm.fase)}">${pm.fase}</span>` : ''}${ok ? '<span class="pill g">✔ feito</span>' : ''}${esp ? '' : '<span class="pl-go">Estudar ›</span>'}</div>
      <div class="pl-meta">${o.plan ? `Planejado <b>${plMin(o.plan)}</b>` : ''}${o.horas.length ? ' · ' + o.horas.map(esc).join(', ') : ''}${o.real ? ` · estudado <b>${plMin(o.real)}</b>` : ''}</div>
      ${o.plan && !esp || o.key === '__solido' ? bar(o.real, o.plan) : ''}
      ${o.key === '__folga' ? '<div class="pl-note">Reserve para imprevistos. Se nada ocorreu: revisão adicional ou mais questões.</div>' : ''}${o.key === '__livre' ? '<div class="pl-note">Tempo livre: use como preferir (revisão, questões, descanso).</div>' : ''}

const PL_METAS = { horas_sem: ['Horas líquidas por semana', 'h/semana', 'últimos 7 dias'], questoes_sem: ['Questões resolvidas por semana', 'questões/semana', 'últimos 7 dias'], pct: ['% de acerto em questões', '%', 'últimos 30 dias'], materias: ['Matérias com “Teoria ok”', 'matéria(s)', 'total'] };
function plMetaVal(tipo) {
  const t = todayISO();
  if (tipo === 'horas_sem') return plAgg(addDaysISO(t, -6), t).min / 60;
  if (tipo === 'questoes_sem') return plAgg(addDaysISO(t, -6), t).q;
  if (tipo === 'pct') { const g = plAgg(addDaysISO(t, -29), t); return g.q ? g.ac / g.q * 100 : 0; }

}
function plMetaEst(m) {

  return { at, p, st, dias: Math.round((new Date(m.prazo) - new Date(t)) / 864e5) };

function plAddBlk(d) { S.plan.dias[d].push({ id: uid(), m: '', min: 60, hora: '' }); UI.focusFk = `plan.dias.${d}.${S.plan.dias[d].length - 1}.m`; save(); render(); }

function plLimpar() { confirmar('Apagar todos os blocos do cronograma semanal?', () => { S.plan.dias = [[], [], [], [], [], [], []]; save(); render(); }, 'Apagar'); }
function plOpts(P, v) {

function plGerar() {
  const P = planMaterias(), dias = S.plan.disp.dias.map((x, i) => x ? i : -1).filter(i => i >= 0), blk = Math.max(30, Math.min(120, num(S.plan.disp.blk) || 60));
  if (!P.length) { toast('Inclua matérias no Ciclo de Estudos primeiro.'); return; }
  if (!dias.length) { toast('Marque pelo menos um dia disponível.'); return; }
  const go = () => {
    let items = P.map(x => ({ key: x.m, min: Math.round(x.def * 60 / 5) * 5, g: plGrupo(x.m), fase: x.fase })).filter(x => x.min > 0);
    if (S.plan.modo === 'hibrido') { const sm = items.filter(x => x.fase === 'Sólido').reduce((s, x) => s + x.min, 0); items = items.filter(x => x.fase !== 'Sólido'); if (sm) items.push({ key: '__solido', min: sm, g: 0 }); }
    items.sort((a, b) => b.min - a.min);
    const D = dias.length, load = Array(7).fill(0), out = [[], [], [], [], [], [], []];
    items.forEach(it => {

/* ---------- metas SMART ---------- */
/* histórico do usuário para avaliar a meta */
function plHist(tipo) {
  const t = todayISO(), ini = semIni(t);
  if (tipo === 'pct') { const a = plAgg('0000-00-00', '9999-99-99'), r = plAgg(addDaysISO(t, -29), t); return { n: a.q, ref: a.q ? a.ac / a.q * 100 : null, rec: r.q ? r.ac / r.q * 100 : null, q: a.q, ac: a.ac, q30: r.q }; }
  if (tipo === 'materias') {
    const ds = DIA().map(e => e.data).filter(Boolean).sort(), meses = ds.length ? Math.max(1, (new Date(t) - new Date(ds[0])) / 864e5 / 30) : 1;
    const n = new Set(S.rgRev.map(r => r.m)).size; return { n, ref: n / meses, atual: plMetaVal('materias'), meses };
  }
  const ds = DIA().filter(e => e.data && (tipo === 'horas_sem' ? num(e.min) > 0 : num(e.q) > 0)).map(e => e.data).sort(); if (!ds.length) return { n: 0 };
  const val = w => { const g = plAgg(w, addDaysISO(w, 6)); return tipo === 'horas_sem' ? g.min / 60 : g.q; }, ws = [];
  for (let w = semIni(ds[0]); w < ini; w = addDaysISO(w, 7)) { if (plFrac(w, addDaysISO(w, 6)) < 0.999) continue; ws.push(val(w)); }
  if (!ws.length) return { n: 0, parcial: val(ini) };
  const ult = ws.slice(-4), avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  return { n: ws.length, ref: avg(ws), rec: avg(ult), best: Math.max(...ws), nUlt: ult.length };
}
function plMetaAval(tipo, alvo, prazo) {
  const h = plHist(tipo), u = PL_METAS[tipo], F = v => plFmtMeta(tipo, v), t = todayISO(), dias = prazo ? Math.round((new Date(prazo) - new Date(t)) / 864e5) : null;
  const sug = v => tipo === 'pct' ? Math.min(99, Math.round(v)) : tipo === 'horas_sem' ? Math.round(v * 2) / 2 : Math.ceil(v);
  const res = (cls, ico, txt, s) => ({ cls, s, html: `<div class="pl-aval ${cls}">${ico} ${txt}${s != null ? ` <button class="btn-sec" style="margin-left:6px;padding:3px 10px" onclick="$('mtAlvo').value=${s};plMetaPrev()">Usar ${F(s)}</button>` : ''}</div>` });
  if (!alvo) return res('n', '📊', 'Digite o valor da meta para eu compará-lo com o seu histórico.');
  if (tipo === 'pct') {
    if (h.n < 20) return res('n', '📊', `Ainda há poucas questões registradas (${h.n}) para avaliar a meta pelo histórico. Continue registrando!`);
    if (alvo > 100) return res('r', '⚠️', 'Percentual acima de 100% não existe. Defina até 100%.', 95);
    const d = alvo - h.ref, hist = `Seu histórico: <b>${fmt(h.ref, 1)}%</b> de acerto (${h.ac} de ${h.q} questões)${h.rec != null ? `; nos últimos 30 dias, <b>${fmt(h.rec, 1)}%</b>` : ''}.`;
    if (d <= -3) return res('b', '⬆️', `${hist}<br>Pelo seu histórico você pode mais — essa meta está <b>abaixo</b> do que você já faz. Vamos aumentar?`, sug(h.ref + 5));
    if (d < 0.5) return res('b', '🤏', `${hist}<br>A meta é praticamente o que você já faz: não desafia. Que tal subir um pouco?`, sug(h.ref + 4));
    if (d <= 8) return res('g', '💪', `${hist}<br>Meta <b>desafiadora e atingível</b>: +${fmt(d, 1)} ponto${Math.abs(d) >= 1.5 ? 's' : ''} percentual${Math.abs(d) >= 1.5 ? 'is' : ''} sobre o seu histórico. Confio em você, vamos lá!`);
    if (d <= 15) return res('y', '🔥', `${hist}<br>Meta <b>ambiciosa</b> (+${fmt(d, 1)} pontos). Você vai ter que se esforçar bastante — mas dá! Dica: se parecer pesado, comece mais perto e vá subindo.`, sug(h.ref + 8));
    return res('r', '🛑', `${hist}<br>Está <b>muito distante</b> do histórico (+${fmt(d, 1)} pontos) e pode desmotivar. Sugiro uma meta intermediária e ir elevando depois.`, sug(h.ref + 8));
  }
  if (tipo === 'materias') {
    const need = (alvo - h.atual) / Math.max(0.25, (dias || 30) / 30), hist = `Hoje você tem <b>${h.atual}</b> matéria(s) com Teoria ok${h.n ? `; seu ritmo histórico é de ~<b>${fmt(h.ref, 1)}</b> por mês` : ''}.`;
    if (alvo <= h.atual) return res('b', '⬆️', `${hist}<br>Você já passou disso — defina uma meta <b>acima</b> do que já tem.`, h.atual + 1);
    if (!h.n) return res('n', '📊', `${hist}<br>Ainda não há revisões gerais concluídas para medir o seu ritmo.`);
    const r = need / h.ref;
    if (r < 0.7) return res('b', '⬆️', `${hist}<br>Pelo seu ritmo, você consegue <b>mais</b> nesse prazo (precisaria de ${fmt(need, 1)}/mês). Vamos aumentar?`, Math.ceil(h.atual + h.ref * Math.max(0.25, (dias || 30) / 30) * 1.2));
    if (r <= 1.3) return res('g', '💪', `${hist}<br>Meta <b>desafiadora e atingível</b> (${fmt(need, 1)}/mês necessários). Confio em você, vamos lá!`);
    if (r <= 2) return res('y', '🔥', `${hist}<br>Meta <b>ambiciosa</b>: exige ${fmt(need, 1)}/mês, acima do seu ritmo. Vai ter que se esforçar!`);
    return res('r', '🛑', `${hist}<br>Exige ${fmt(need, 1)} matéria(s) por mês, muito acima do seu ritmo — pode ficar inalcançável. Sugiro reduzir um pouco ou ampliar o prazo.`, Math.max(h.atual + 1, Math.floor(h.atual + h.ref * Math.max(0.25, (dias || 30) / 30) * 1.3)));
  }

  if (!h.n) return res('n', '📊', `Ainda não há semanas completas de histórico para avaliar a meta${h.parcial ? ` (nesta semana você já fez ${F(h.parcial)})` : ''}. Após a primeira semana fechada eu comparo com você!`);
  const base = h.n >= 3 ? h.ref : h.ref, r = alvo / base, hist = `Seu histórico: <b>${F(h.ref)}</b> ${tipo === 'horas_sem' ? 'por semana' : u[1]} em média (${h.n} semana${h.n > 1 ? 's' : ''})${h.nUlt > 1 ? `; últimas ${h.nUlt}: <b>${F(h.rec)}</b>` : ''}; melhor semana: <b>${F(h.best)}</b>.`;
  if (r <= 0.9) return res('b', '⬆️', `${hist}<br>Pelo seu histórico você pode mais — essa meta ficou <b>aquém</b> (${fmt((1 - r) * 100, 0)}% abaixo da sua média). Vamos aumentar essa meta?`, sug(Math.max(h.ref * 1.15, h.rec || 0)));
  if (r < 1.03) return res('b', '🤏', `${hist}<br>A meta é igual ao que você já faz — sem desafio. Sugiro subir um pouco.`, sug(h.ref * 1.15));
  if (r <= 1.25) return res('g', '💪', `${hist}<br>Meta <b>desafiadora e atingível</b> (+${fmt((r - 1) * 100, 0)}% sobre a média). Confio em você, vamos lá!`);
  if (r <= 1.6) return res('y', '🔥', `${hist}<br>Meta <b>ambiciosa</b> (+${fmt((r - 1) * 100, 0)}% sobre a média${alvo <= h.best ? ', mas você já chegou a ' + F(h.best) + ' numa semana — dá para sustentar' : ''}). Você vai ter que se esforçar, confio em você, vamos lá!${dias != null && dias < 14 ? ' <b>Prazo curto</b>: considere mais tempo.' : ''}`, alvo > h.best * 1.1 ? sug(Math.max(h.best, h.ref * 1.3)) : null);
  return res('r', '🛑', `${hist}<br>Meta <b>muito acima</b> do histórico (+${fmt((r - 1) * 100, 0)}% sobre a média). Pode virar frustração em vez de motivação. Sugiro uma meta intermediária e ir subindo.`, sug(Math.max(h.best, h.ref * 1.3)));
}

  <ul><li>Se você <b>trocar de navegador</b> (Chrome → Edge, por exemplo), os dados <b>não aparecem</b> no outro.</li>
  <li>Se abrir em <b>outro aparelho</b> (tablet, celular, outro computador), ele começa <b>vazio</b>. Os dados não vão sozinhos de um aparelho para o outro.</li>
  <li>Se <b>limpar os dados de navegação</b>, usar <b>aba anônima/privada</b> ou reinstalar o navegador, você <b>perde tudo</b>.</li>
  <li>Se o computador <b>quebrar, for roubado ou "pegar fogo", já era.</b> Não existe cópia em lugar nenhum.</li></ul>
  <p><b>Por isso, faça backup com frequência</b> (sugestão: ao fim de toda semana de estudo):</p>
  <ol><li>Vá em <b>Backup e dados</b> (menu lateral) e use o <b>Backup (.json)</b>.</li><li><b>Guarde o arquivo fora do aparelho</b>: Google Drive, OneDrive, e-mail ou pendrive.</li><li>Para recuperar, use <b>Restaurar backup</b> na mesma página.</li></ol>
  <p class="hint-p">O arquivo do <b>Backup (.json)</b> é o único que guarda <b>tudo</b>. As planilhas exportadas levam só os dados que cabem nas planilhas originais.</p></div>

  <div class="card av-card"><h3>4. Sincronização e salvamento na nuvem</h3>
  <p>Hoje <b>não há sincronização automática</b> entre aparelhos. Existe uma opção <b>em desenvolvimento</b> para sincronizar dispositivos e salvar na nuvem, para tornar o uso mais seguro. Enquanto ela não estiver disponível para você, o backup manual é a sua proteção.</p>
  <p>Mesmo quando houver, <b>será opcional: fica a critério de cada pessoa usar ou não.</b> Ela não dispensa o hábito de fazer backup.</p></div>

  <div class="card av-card"><h3>5. Outros cuidados</h3>
  <ul><li><b>Sem garantias.</b> A ferramenta é oferecida <b>"como está"</b>. Pode ter erros. Confira os números importantes (horas, metas, ciclo) com o que o curso ensina e com as suas planilhas.</li>
  <li><b>Sugestões são só sugestões.</b> Os avisos, metas e comparações do programa não são ordens. A decisão sobre como estudar é <b>sua</b>.</li>
  <li><b>Privacidade.</b> Nada é enviado a ninguém. Seus dados ficam no seu aparelho (e, se você ligar a sincronização, na sua própria conta Google).</li>
  <li><b>Não compartilhe o seu backup</b> com desconhecidos: ele contém todo o seu histórico de estudo.</li>
  <li><b>Comece pelo "Comece Aqui".</b> Ele leva você pelos passos na ordem certa.</li></ul></div>

}

/* ---- tema personalizado: o usuário escolhe 5 cores, o resto é derivado ---- */
const CUSTOM_KEY = 'estudo_tema_custom_v1';
const CUSTOM_DEF = { fundo: '#f1f5f9', cartao: '#ffffff', principal: '#059669', secundaria: '#0284c7', texto: '#0f172a' };
let CUSTOM = Object.assign({}, CUSTOM_DEF);
try { const j = JSON.parse(localStorage.getItem(CUSTOM_KEY) || 'null'); if (j) Object.keys(CUSTOM_DEF).forEach(k => { if (/^#[0-9a-f]{6}$/i.test(j[k] || '')) CUSTOM[k] = j[k]; }); } catch (e) { }
const hx2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rg2hx = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

const contrastOn = h => lumHex(h) > .38 ? '#1a1410' : '#ffffff';
function customTheme() {
  const c = CUSTOM, dark = lumHex(c.fundo) < .25, t = c.texto;
  return {
    nome: 'Personalizado', desc: 'O padrão. Escolha suas próprias cores.', dark: dark ? 1 : 0,
    v: { 'bg-main': c.fundo, 'bg-card': c.cartao, 'bg-card-hover': mixHex(c.cartao, t, .06), 'bg-input': dark ? c.fundo : c.cartao, 'bg-side': mixHex(c.fundo, c.cartao, .5), 'bg-head': mixHex(c.cartao, t, .06), primary: c.principal, 'primary-dark': mixHex(c.principal, '#000000', .18), accent: c.secundaria, warning: dark ? '#f59e0b' : '#d97706', danger: dark ? '#ef4444' : '#dc2626', 'text-main': t, 'text-soft': mixHex(t, c.fundo, dark ? .25 : .15), 'text-muted': mixHex(t, c.fundo, dark ? .5 : .32), border: mixHex(c.fundo, t, .16), 'on-primary': contrastOn(c.principal) }
  };
}
Object.defineProperty(THEMES, 'custom', { enumerable: true, configurable: true, get: customTheme });
const TEMA_VARS = ['on-hover', 'bg-main', 'bg-card', 'bg-card-hover', 'bg-input', 'bg-side', 'bg-head', 'primary', 'primary-dark', 'accent', 'warning', 'danger', 'text-main', 'text-soft', 'text-muted', 'border', 'on-primary'];

  r.dataset.theme = k; r.dataset.mode = t.dark ? 'dark' : 'light'; r.style.colorScheme = t.dark ? 'dark' : 'light';
}
function carregarTema() { let k = 'custom'; try { k = localStorage.getItem(TEMA_KEY) || k; } catch (e) { } if (k === 'claro') k = 'custom'; aplicarTema(k); }

const CUSTOM_LBL = { fundo: 'Fundo', cartao: 'Painéis', principal: 'Cor principal', secundaria: 'Cor secundária', texto: 'Texto' };
function setCustom(k, v) {

}
function resetCustom() { CUSTOM = Object.assign({}, CUSTOM_DEF); try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(CUSTOM)); } catch (e) { } aplicarTema('custom'); render(); }
function temaPrev(k) { const v = Object.assign({ 'bg-main': '#0b1120', 'bg-card': '#1e293b', 'bg-side': '#0a0f1d', primary: '#10b981', accent: '#38bdf8', border: '#334155' }, THEMES[k].v);
  return `<div class="tema-prev" style="background:${v['bg-main']}"><div class="s" style="background:${v['bg-side']};border:1px solid ${v.border}"></div><div class="m"><i style="background:${v['bg-card']};border:1px solid ${v.border}"></i><i style="background:${v['bg-card']};border:1px solid ${v.border};flex:.6"></i><div style="display:flex;gap:5px;height:12px"><i style="background:${v.primary};flex:1;border-radius:4px"></i><i style="background:${v.accent};flex:1;border-radius:4px"></i></div></div></div>`; }
function pageTema() {
